name: Jarvis
options:
  minimumXcodeGenVersion: 2.45.3
  bundleIdPrefix: ai.realjarvis
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 3
    DEVELOPMENT_TEAM: T5AFHQ4L9C
packages:
  MLXAudio:
    path: vendor/mlx-audio-swift
targets:
  JarvisCore:
    type: framework.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Jarvis/Sources/JarvisCore
      - path: Jarvis/MobileShared/Sources/JarvisMobileShared/JarvisConvexSyncClient.swift
      - path: Jarvis/MobileShared/Sources/JarvisMobileShared/JarvisHostConfiguration.swift
      - path: Jarvis/Shared/Sources/JarvisShared
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: CryptoKit.framework
      - sdk: Network.framework
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: JarvisCore

  JarvisCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Jarvis/App
    dependencies:
      - target: JarvisCore
    settings:
      base:
        PRODUCT_NAME: Jarvis
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Real Jarvis uses the microphone for continuous voice interaction.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Real Jarvis transcribes spoken commands to operate hands-free.

  JarvisCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Jarvis/Tests/JarvisCoreTests
    dependencies:
      - target: JarvisCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  JarvisMobileCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Jarvis/Mobile/Sources/JarvisMobileCore
      - path: Jarvis/MobileShared/Sources/JarvisMobileShared
      - path: Jarvis/Shared/Sources/JarvisShared
      - path: Jarvis/Mobile/Resources
        buildPhase: resources
      - path: voice-samples/0299_TINCANS_CANONICAL.wav
        buildPhase: resources
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: BackgroundTasks.framework
      - sdk: CryptoKit.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: AppIntents.framework
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CloudKit.framework
      - sdk: HomeKit.framework
      - sdk: CarPlay.framework
      - sdk: Speech.framework
      - sdk: CoreMotion.framework
      - sdk: PassKit.framework
      - package: MLXAudio
        product: MLXAudioCore
      - package: MLXAudio
        product: MLXAudioTTS
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: JarvisMobileCore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "JARVIS reads your health data to provide context-aware assistance during EMS operations and daily life."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "JARVIS records workout and health data to maintain your wellness profile."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: J.A.R.V.I.S. captures speech for hands-free voice interaction.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: J.A.R.V.I.S. transcribes spoken commands for voice-driven operation.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: J.A.R.V.I.S. uses location to provide route, presence, and situational-awareness context.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: J.A.R.V.I.S. uses background location only for operator-authorized presence and safety automations.
        INFOPLIST_KEY_NSMotionUsageDescription: J.A.R.V.I.S. reads motion activity to understand walking, driving, stationary, and responder-context state.
        INFOPLIST_KEY_NSHomeKitUsageDescription: J.A.R.V.I.S. connects to your HomeKit home so authorized cockpit actions can control local devices.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: J.A.R.V.I.S. uses Bluetooth-adjacent audio routing context for authorized private comms endpoints.

  JarvisWatchCore:
    type: framework
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Jarvis/Watch/Sources/JarvisWatchCore
      - path: Jarvis/MobileShared/Sources/JarvisMobileShared
      - path: Jarvis/Shared/Sources/JarvisShared
    dependencies:
      - sdk: CryptoKit.framework
      - sdk: HealthKit.framework
      - sdk: Network.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: JarvisWatchCore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "JARVIS reads your vital signs to provide real-time health context."

  JarvisPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: ai.realjarvis.phone
    entitlements:
      path: Jarvis/Mobile/Entitlements/JarvisPhone.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        aps-environment: production
        com.apple.developer.icloud-container-identifiers:
          - iCloud.ai.realjarvis.cloud
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.ai.realjarvis
    sources:
      - path: Jarvis/Mobile/AppShared
      - path: Jarvis/Mobile/AppiPhone
      - path: Jarvis/Mobile/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: JarvisMobileCore
      - target: JarvisWatchApp
    settings:
      base:
        PRODUCT_NAME: JarvisPhone
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.phone
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Jarvis
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_JARVIS_HOST_ADDRESS: "$(JARVIS_HOST_ADDRESS)"
        INFOPLIST_KEY_JARVIS_HOST_PORT: "$(JARVIS_HOST_PORT)"
        INFOPLIST_KEY_JARVIS_CONVEX_URL: https://enduring-starfish-794.convex.cloud
        INFOPLIST_KEY_JARVIS_SHARED_SECRET: "$(JARVIS_SHARED_SECRET)"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: J.A.R.V.I.S. captures speech for cockpit voice startup and command handling.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: J.A.R.V.I.S. transcribes spoken commands for voice-driven operation.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: J.A.R.V.I.S. uses location to provide route, presence, and situational-awareness context.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: J.A.R.V.I.S. uses background location only for operator-authorized presence and safety automations.
        INFOPLIST_KEY_NSMotionUsageDescription: J.A.R.V.I.S. reads motion activity to understand walking, driving, stationary, and responder-context state.
        INFOPLIST_KEY_NSHomeKitUsageDescription: J.A.R.V.I.S. connects to your HomeKit home so authorized cockpit actions can control local devices.
        INFOPLIST_KEY_NSHealthShareUsageDescription: J.A.R.V.I.S. reads health data only with permission to provide operator safety and context.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: J.A.R.V.I.S. writes health data only with permission for operator-approved wellness records.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: J.A.R.V.I.S. uses Bluetooth-adjacent audio routing context for authorized private comms endpoints.
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: J.A.R.V.I.S. triggers proactive interruptions when the host brain emits a push event.
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
          - processing
          - remote-notification
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - ai.realjarvis.mobile.refresh

  JarvisPad:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: ai.realjarvis.pad
    entitlements:
      path: Jarvis/Mobile/Entitlements/JarvisPad.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        aps-environment: production
        com.apple.developer.icloud-container-identifiers:
          - iCloud.ai.realjarvis.cloud
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.ai.realjarvis
    sources:
      - path: Jarvis/Mobile/AppShared
      - path: Jarvis/Mobile/AppiPad
      - path: Jarvis/Mobile/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: JarvisMobileCore
    settings:
      base:
        PRODUCT_NAME: JarvisPad
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.pad
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_CFBundleDisplayName: Jarvis Cockpit
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_JARVIS_HOST_ADDRESS: "$(JARVIS_HOST_ADDRESS)"
        INFOPLIST_KEY_JARVIS_HOST_PORT: "$(JARVIS_HOST_PORT)"
        INFOPLIST_KEY_JARVIS_CONVEX_URL: https://enduring-starfish-794.convex.cloud
        INFOPLIST_KEY_JARVIS_SHARED_SECRET: "$(JARVIS_SHARED_SECRET)"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: J.A.R.V.I.S. captures speech for cockpit voice startup and command handling.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: J.A.R.V.I.S. transcribes spoken commands for voice-driven operation.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: J.A.R.V.I.S. uses location to provide route, presence, and situational-awareness context.
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: J.A.R.V.I.S. uses background location only for operator-authorized presence and safety automations.
        INFOPLIST_KEY_NSMotionUsageDescription: J.A.R.V.I.S. reads motion activity to understand walking, driving, stationary, and responder-context state.
        INFOPLIST_KEY_NSHomeKitUsageDescription: J.A.R.V.I.S. connects to your HomeKit home so authorized cockpit actions can control local devices.
        INFOPLIST_KEY_NSHealthShareUsageDescription: J.A.R.V.I.S. reads health data only with permission to provide operator safety and context.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: J.A.R.V.I.S. writes health data only with permission for operator-approved wellness records.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: J.A.R.V.I.S. uses Bluetooth-adjacent audio routing context for authorized private comms endpoints.
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: J.A.R.V.I.S. triggers proactive interruptions when the host brain emits a push event.
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
          - processing
          - remote-notification
        INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers:
          - ai.realjarvis.mobile.refresh

  JarvisWatchApp:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: ai.realjarvis.phone.watchkitapp
    dependencies:
      - target: JarvisWatchExtension
    sources:
      - path: Jarvis/Watch/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: JarvisWatch
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.phone.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Jarvis
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: ai.realjarvis.phone

  JarvisWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    deploymentTarget: "10.0"
    bundleId: ai.realjarvis.phone.watchkitapp.watchkitextension
    sources:
      - path: Jarvis/Watch/Extension
    dependencies:
      - target: JarvisWatchCore
    settings:
      base:
        PRODUCT_NAME: JarvisWatchExtension
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.phone.watchkitapp.watchkitextension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Jarvis/Watch/Extension/Info.plist

  JarvisMacCore:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Jarvis/Mac/Sources/JarvisMacCore
        excludes:
          - JarvisMacCockpitStoreTests.swift
      - path: Jarvis/MobileShared/Sources/JarvisMobileShared
      - path: Jarvis/Shared/Sources/JarvisShared
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework
      - sdk: CryptoKit.framework
    settings:
      base:
        DEFINES_MODULE: YES
        PRODUCT_NAME: JarvisMacCore
        GENERATE_INFOPLIST_FILE: YES

  JarvisMacCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Jarvis/Mac/Sources/JarvisMacCore/JarvisMacCockpitStoreTests.swift
      - path: Jarvis/Tests/JarvisMacCoreTests
    dependencies:
      - target: JarvisMacCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  RealJarvisMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    bundleId: ai.realjarvis.mac
    sources:
      - path: Jarvis/Mac/AppMac
    dependencies:
      - target: JarvisMacCore
    settings:
      base:
        PRODUCT_NAME: RealJarvisMac
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.mac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: J.A.R.V.I.S.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: J.A.R.V.I.S. uses the microphone for voice interaction.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: J.A.R.V.I.S. transcribes spoken commands.

  RealJarvisVision:
    type: application
    platform: visionOS
    deploymentTarget: "1.0"
    bundleId: ai.realjarvis.vision
    sources:
      - path: Jarvis/Vision/AppVision
    settings:
      base:
        PRODUCT_NAME: RealJarvisVision
        PRODUCT_BUNDLE_IDENTIFIER: ai.realjarvis.vision
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: J.A.R.V.I.S. Vision

schemes:
  Jarvis:
    build:
      targets:
        JarvisCLI: all
        JarvisCoreTests: [test]
    test:
      targets:
        - JarvisCoreTests

  JarvisPhone:
    build:
      targets:
        JarvisPhone: all

  JarvisPad:
    build:
      targets:
        JarvisPad: all

  JarvisWatch:
    build:
      targets:
        JarvisWatchApp: all
        JarvisWatchExtension: all

  RealJarvisMac:
    build:
      targets:
        RealJarvisMac: all
        JarvisMacCoreTests: [test]
    test:
      targets:
        - JarvisMacCoreTests

  RealJarvisPhone:
    build:
      targets:
        JarvisPhone: all

  RealJarvisPad:
    build:
      targets:
        JarvisPad: all

  RealJarvisWatch:
    build:
      targets:
        JarvisWatchApp: all
        JarvisWatchExtension: all

  RealJarvisVision:
    build:
      targets:
        RealJarvisVision: all

  all:
    build:
      targets:
        JarvisCore: all
        JarvisCLI: all
        JarvisMacCore: all
        RealJarvisMac: all
